name: SignalForge production readiness
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalforge_test
      DATABASE_SSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Install exact production dependency
        run: bun install
      - name: Validate scoped Company OS GitHub Runner Python syntax
        run: python3 -m py_compile scripts/company-os-delivery.py scripts/company-os-readback.py
      - name: Prove coding agent generated source enters real SignalForge market runtime
        run: python3 tests/test_company_os_delivery_registry.py
      - name: Verify isolated Company OS closeout and three-stage continuation
        run: python3 tests/test_company_os_closeout.py
      - name: Verify isolated verifier failure reasons are safe and actionable
        run: python3 tests/test_company_os_closeout_errors.py
      - name: Compile runtime
        run: bun run check
      - name: Compile live Railway Growth Function source
        run: bun build services/growth-assets/railway-function.ts --target=bun --external=postgres --outfile=/tmp/signalforge-growth-function-check.js
      - name: Compile existing Railway Lifecycle Function with paid digest
        run: bun build services/lifecycle-worker/railway-function.ts --target=bun --external=postgres --outfile=/tmp/signalforge-lifecycle-function-check.js
      - name: Verify signed billing entitlement policy tests
        run: bun test tests/billing-evidence.test.mjs
      - name: Build deployable production Docker image
        run: docker build --tag signalforge:ci .
      - name: Smoke-compile actual production container imports
        run: |
          docker run --rm --entrypoint bun signalforge:ci build src/server.ts --target=bun --external=postgres --outfile=/tmp/signalforge-container-smoke.js
      - name: Start actual production image and verify HTTP health
        run: |
          docker run -d --name signalforge-container-smoke -p 18090:18090 -e PORT=18090 signalforge:ci
          trap 'docker logs signalforge-container-smoke --tail=40 || true; docker rm -f signalforge-container-smoke >/dev/null 2>&1 || true' EXIT
          for n in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:18090/api/health > /tmp/signalforge-container-health.json; then
              grep -q '"service":"SIGNALFORGE"' /tmp/signalforge-container-health.json
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Test real PostgreSQL signup, community moderation and Company OS read-only snapshot
        run: bun run test
      - name: Verify product structure and no leaked environmental secret files
        run: |
          test -f Dockerfile && test -f railway.json
          test -f public/index.html && test -f public/welcome.html
          test -f services/growth-assets/railway-function.ts
          test -f services/lifecycle-worker/railway-function.ts
          ! git ls-files | grep -E '^\.env$|^\.env\.production$'
