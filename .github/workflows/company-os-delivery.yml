name: SINA Company OS - governed SignalForge code delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/company-os-delivery.yml"
      - "scripts/company-os-delivery.py"
      - "scripts/company-os-readback.py"
      - "scripts/company-os-closeout.py"
      - "tests/test_company_os_closeout.py"
      - "scripts/company-os-closeout.py"
      - "company-os/organization.v2.json"
      - "company-os/workforce-floor.ts"
      - "src/market-source-integrity.ts"
      - "company-os/generated/runtime-registry.ts"
      - "tests/test_company_os_delivery_registry.py"
      - "AGENTS.md"
      - "strategy/PRODUCT-IDENTITY-SSOT-v3.json"
      - "docs/FOUNDER-PRODUCT-UX-OPERATING-CONTRACT-v3.md"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: sina-company-os-delivery-signalforge
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      ${{ github.event_name != 'issues' || (github.event.issue.title == 'SINA: Run Company OS Delivery' && github.event.issue.user.login == 'kazemnezhadsina144-dot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalforge_test
      DATABASE_SSL: disable
      NODE_ENV: test
    outputs:
      state: ${{ steps.deliver.outputs.state }}
      head_sha: ${{ steps.deliver.outputs.head_sha }}
      workstream: ${{ steps.deliver.outputs.workstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install exact SignalForge production dependencies
        run: bun install
      - name: Syntax-check authenticated Company OS delivery scripts
        run: python3 -m py_compile scripts/company-os-delivery.py scripts/company-os-readback.py
      - name: Prove generated market rules are consumable in the actual SignalForge runtime
        run: python3 tests/test_company_os_delivery_registry.py
      - name: Claim canonical scoped WorkPacket and build one bounded PR candidate
        id: deliver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/company-os-delivery.py
      - name: Return bounded real execution status to the Founder trigger issue
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNALFORGE_TRIGGER_ISSUE: ${{ github.event.issue.number }}
          DELIVERY_STATE: ${{ steps.deliver.outputs.state }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d={}
          f=Path("company-delivery-diagnostics.json")
          if f.is_file():
              d=json.loads(f.read_text())
          state=os.environ.get("DELIVERY_STATE") or d.get("state") or "UNREPORTED"
          stage=d.get("stage","COMPANY_OS_SOURCE_OR_CANDIDATE")
          kind=d.get("error_type","NONE")
          link="https://github.com/Noetfield-Systems/SignalForge/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          Path("/tmp/sina-delivery-status.md").write_text(
              "SignalForge M20 Company OS delivery — observed GitHub Actions state\n\n"
              +"- State: `"+state+"`\n"
              +"- Failed stage: `"+str(stage)+"`\n"
              +"- Error type: `"+str(kind)+"`\n"
              +"- Workstream prefix: `"+str(d.get("workstream_prefix","not_claimed"))+"`\n"
              +"- [Actual runner and checks]("+link+")\n\n"
              +"No fabricated production release, payment, active users or independently verified business outcome.\n")
          PY
          gh issue comment "$SIGNALFORGE_TRIGGER_ISSUE" --repo Noetfield-Systems/SignalForge --body-file /tmp/sina-delivery-status.md
      - name: Preserve bounded failing-stage diagnostics for independent review
        if: ${{ always() && steps.deliver.outputs.state == 'FAILED' }}
        uses: actions/upload-artifact@v4
        with:
          name: sina-signalforge-delivery-failure-${{ github.run_id }}
          path: company-delivery-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve exact source and candidate evidence
        if: ${{ steps.deliver.outputs.state == 'OPENED' || steps.deliver.outputs.state == 'BRANCH_READY' }}
        uses: actions/upload-artifact@v4
        with:
          name: sina-signalforge-workpacket-${{ github.run_id }}
          path: company-delivery-evidence.json
          if-no-files-found: error
          retention-days: 30

  independent-readback:
    if: ${{ needs.candidate.outputs.state == 'OPENED' || needs.candidate.outputs.state == 'BRANCH_READY' }}
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalforge_test
      DATABASE_SSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - uses: actions/download-artifact@v4
        with:
          name: sina-signalforge-workpacket-${{ github.run_id }}
          path: /tmp/sina-company-evidence
      - name: Independent immutable-source readback and real application tests
        env:
          SINA_EVIDENCE_FILE: /tmp/sina-company-evidence/company-delivery-evidence.json
        run: |
          bun install
          rm -f bun.lock bun.lockb
          python3 scripts/company-os-readback.py

  closeout:
    needs: [candidate, independent-readback]
    if: ${{ always() && needs.candidate.result == 'success' && (needs.candidate.outputs.state == 'OPENED' || needs.candidate.outputs.state == 'BRANCH_READY') && needs.independent-readback.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: ${{ needs.candidate.outputs.head_sha != '' }}
        uses: actions/download-artifact@v4
        with:
          name: sina-signalforge-workpacket-${{ github.run_id }}
          path: /tmp/sina-company-evidence
      - name: Validate isolated verifier closeout and next-action contract
        run: python3 tests/test_company_os_closeout.py
      - name: Verify GitHub provenance with isolated verifier and advance existing queue
        id: verified
        env:
          SINA_EVIDENCE_FILE: /tmp/sina-company-evidence/company-delivery-evidence.json
        run: python3 scripts/company-os-closeout.py
      - name: Dispatch next actual Founder-verified coding WorkPacket
        if: ${{ steps.verified.outputs.state == 'TECHNICALLY_VERIFIED' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run company-os-delivery.yml --ref main
      - name: Preserve actual verifier conflict evidence without promoting it
        if: ${{ always() && steps.verified.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: sina-signalforge-closeout-failure-${{ github.run_id }}
          path: company-delivery-closeout-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sina-signalforge-verification-${{ github.run_id }}
          path: company-delivery-verification.json
          if-no-files-found: ignore
          retention-days: 90

  verify-existing-candidate:
    # Recovery only: real earlier candidate + independent readback were already
    # completed. This is NOT a second scheduler or a way to forge a receipt.
    if: ${{ github.event_name == 'issues' && github.event.issue.title == 'SINA: Verify Existing Company OS Delivery' && github.event.issue.user.login == 'kazemnezhadsina144-dot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse strict original run reference from owner-authored issue
        id: source
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          issue=event.get('issue',{})
          title=issue.get('title')
          actor=(issue.get('user') or {}).get('login')
          body=issue.get('body') or ''
          if title!='SINA: Verify Existing Company OS Delivery' or actor!='kazemnezhadsina144-dot':
              raise SystemExit('RECOVERY_ISSUE_NOT_AUTHORIZED')
          match=re.fullmatch(r'\s*delivery_run_id:\s*([1-9][0-9]{7,19})\s*',body)
          if not match:
              raise SystemExit('ORIGINAL_DELIVERY_RUN_ID_MISSING')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as output:
              output.write('run_id='+match.group(1)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: sina-signalforge-workpacket-${{ steps.source.outputs.run_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/sina-company-evidence
      - name: Bind old immutable artifact to its verified originating GitHub run
        env:
          ORIGINAL_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          path=Path('/tmp/sina-company-evidence/company-delivery-evidence.json')
          data=json.loads(path.read_text())
          if (data.get('schema')!='sina.company-delivery.builder-evidence.v1'
                  or data.get('repo')!='Noetfield-Systems/SignalForge'
                  or data.get('project_id')!='signalforge-market-intelligence'
                  or data.get('independently_verified') is not False
                  or not re.fullmatch(r'[a-f0-9]{32}',str(data.get('workstream_id','')))
                  or not re.fullmatch(r'[a-f0-9]{40}',str(data.get('head_sha','')))):
              raise SystemExit('RECOVERY_ARTIFACT_NOT_ORIGINAL_COMPANY_SCOPE')
          data['delivery_run_id']=os.environ['ORIGINAL_RUN_ID']
          path.write_text(json.dumps(data,sort_keys=True))
          PY
      - name: Check independent verifier closeout contract
        run: python3 tests/test_company_os_closeout.py
      - name: Verify actual earlier candidate with original run/source provenance
        id: verified
        env:
          SINA_EVIDENCE_FILE: /tmp/sina-company-evidence/company-delivery-evidence.json
        run: python3 scripts/company-os-closeout.py
      - name: Preserve bounded upstream 409 diagnostics
        if: ${{ always() && steps.verified.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: sina-existing-closeout-failure-${{ github.run_id }}
          path: company-delivery-closeout-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Resume canonical next WorkPacket after genuine independently verified DONE
        if: ${{ steps.verified.outputs.state == 'TECHNICALLY_VERIFIED' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run company-os-delivery.yml --ref main

      - name: Recovery result to the authenticated source issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_ISSUE: ${{ github.event.issue.number }}
          READBACK_STATE: ${{ steps.verified.outputs.state }}
          READBACK_OUTCOME: ${{ steps.verified.outcome }}
          RECOVERY_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          state="TECHNICALLY_VERIFIED" if (os.environ.get("READBACK_STATE")=="TECHNICALLY_VERIFIED"
                  and os.environ.get("READBACK_OUTCOME")=="success") else "NOT_VERIFIED"
          diagnostics=Path("company-delivery-closeout-diagnostics.json")
          cause="NONE"
          if diagnostics.is_file():
              obj=json.loads(diagnostics.read_text())
              raw=str(obj.get("reason_code") or obj.get("stage") or "UNKNOWN")
              cause=raw[:100] if all(c.isascii() and (c.isalnum() or c=="_") for c in raw) else "UNCLASSIFIED"
          text=("Original SignalForge Company OS candidate recovery — source readback.\\n\\n"
                +"- Independent closeout: "+state+"\\n"
                +"- Failure reason code: "+cause+"\\n"
                +"- [Actual GitHub Actions run](https://github.com/Noetfield-Systems/SignalForge/actions/runs/"+os.environ["RECOVERY_RUN"]+")\\n"
                +"No production release, users, token, money or three-chain autonomy are claimed here.\\n")
          Path("/tmp/sina-recovery-status.md").write_text(text)
          PY
          gh issue comment "$RECOVERY_ISSUE" --repo Noetfield-Systems/SignalForge --body-file /tmp/sina-recovery-status.md
