name: SignalForge Token Radar external production smoke
on:
  pull_request:
    paths: [".github/workflows/token-radar-live-smoke.yml"]
  push:
    branches: [main]
    paths:
      - ".github/workflows/token-radar-live-smoke.yml"
      - "src/token-radar.mjs"
      - "src/server.ts"
      - "public/token-radar.html"
      - "src/scanner-research.ts"
      - "public/index.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:

  verify-market-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE: https://signalforge-web-production.up.railway.app
    steps:
      - name: Independently inspect deployed TradingView × DEX Screener source-ranked scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 4 --max-time 25 "$BASE/app?view=scanner" -o /tmp/signalforge-scanner.html
          grep -q 'id="scanSourceFilter"' /tmp/signalforge-scanner.html
          grep -q 'id="scanBiasFilter"' /tmp/signalforge-scanner.html
          grep -q 'id="scannerMeta"' /tmp/signalforge-scanner.html
          curl -fsS --retry 3 --retry-delay 4 --max-time 45 "$BASE/api/scanner?interval=60" -o /tmp/signalforge-source-scanner.json
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/signalforge-source-scanner.json"))
          assert x["schema"]=="signalforge.source-ranked-scanner.v1"
          assert x["coverage"]["markets"]==10
          assert x["coverage"]["independentVerification"] is False
          assert x["count"]==len(x["items"])==50
          assert x["liveRankedCount"]+x["unrankedCount"]==50
          ranked=[z for z in x["items"] if z["rankEligible"]]
          excluded=[z for z in x["items"] if not z["rankEligible"]]
          assert all(z["mode"]=="LIVE_PUBLIC_DATA" and z["sourceStatus"]=="KRAKEN_SOURCE_CURRENT" for z in ranked)
          assert [z["liveRank"] for z in ranked]==list(range(1,len(ranked)+1))
          assert all(z["liveRank"] is None for z in excluded)
          assert all(z["evidence"]["independentlyVerified"] is False for z in x["items"])
          assert all(z["evidence"]["tradingAuthorized"] is False for z in x["items"])
          assert all(z["researchLinks"]["chart"].startswith("/app?view=dashboard&symbol=") for z in x["items"])
          assert all(z["researchLinks"]["backtest"] is None or z["researchLinks"]["backtest"].startswith("/app?view=backtest&symbol=") for z in x["items"])
          assert all(z["rankEligible"] for z in x["items"][:len(ranked)])
          print("SIGNALFORGE_DEPLOYED_SCANNER_VERIFIED source_current="+str(x["coverage"]["currentMarkets"])
            +" live_ranked="+str(len(ranked))+" excluded="+str(len(excluded))
            +" source_policy="+x["sourcePolicy"]+" time="+x["scannedAt"])
          PY
  verify-production-token:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE: https://signalforge-web-production.up.railway.app
      MINT: So11111111111111111111111111111111111111112
    steps:
      - name: Verify public radar and invalid-address contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$BASE/radar" -o /tmp/radar.html
          grep -q 'Know what the' /tmp/radar.html
          curl -fsS --max-time 20 "$BASE/tokens/solana/$MINT" -o /tmp/report.html
          grep -q 'Solana token So11111111111111111111111111111111111111112' /tmp/report.html
          invalid_code=$(curl -sS --max-time 20 -o /tmp/invalid.json -w "%{http_code}" "$BASE/api/tokens/lookup?chain=solana&address=INVALID")
          test "$invalid_code" = "400"
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/invalid.json"))
          assert data["error"]=="INVALID_SOLANA_ADDRESS",data
          print("PUBLIC_PAGE_OK; SHARE_URL_OK; INVALID_MINT_REJECTED")
          PY
      - name: Verify real upstream Solana pools and provenance
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            code=$(curl -sS --max-time 25 -o /tmp/token.json -w "%{http_code}" "$BASE/api/tokens/lookup?chain=solana&address=$MINT" || true)
            if test "$code" = "200"; then
              if python3 - <<'PY'
          import json
          x=json.load(open("/tmp/token.json"))
          assert x["chainId"]=="solana"
          assert x["address"]=="So11111111111111111111111111111111111111112"
          assert x["status"]=="OBSERVED" and x["poolCount"]>0
          assert x["source"]["name"]=="DEX Screener"
          assert x["source"]["observedAt"] and x["source"]["endpoint"].startswith("https://api.dexscreener.com/")
          assert x["primaryPool"]["address"]
          assert x["primaryPool"]["liquidityUsd"] is None or x["primaryPool"]["liquidityUsd"]>=0
          assert x["historyStatus"] in ("INSUFFICIENT_HISTORY","AVAILABLE"),x["historyStatus"]
          print("LIVE_PROVIDER_VERIFIED pools="+str(x["poolCount"])+" observed="+x["source"]["observedAt"])
          PY
              then exit 0; fi
            fi
            echo "Attempt $attempt: HTTP $code; retrying before declaring failure"
            sleep 6
          done
          python3 - <<'PY'
          import json
          try:
              x=json.load(open("/tmp/token.json"))
              print("INDEPENDENT_LIVE_CHECK_FAILED status="+str(x.get("status",x.get("error","UNKNOWN"))))
          except Exception:
              print("INDEPENDENT_LIVE_CHECK_FAILED response_unreadable")
          PY
          exit 1

      - name: Verify production persistence and private watchlist boundaries
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$BASE/api/tokens/history?address=$MINT" -o /tmp/history.json
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/history.json"))
          assert x["chainId"]=="solana"
          assert x["address"]=="So11111111111111111111111111111111111111112"
          assert isinstance(x["observations"],list) and len(x["observations"])>=1
          assert isinstance(x["events"],list)
          assert x["historyStatus"] in ("INSUFFICIENT_HISTORY","AVAILABLE")
          assert x["source"]=="DEX Screener"
          print("LIVE_HISTORY_VERIFIED observations="+str(len(x["observations"]))+" events="+str(len(x["events"])))
          PY
          for route in watchlist notifications; do
            code=$(curl -sS --max-time 20 -o "/tmp/private-$route.json" -w "%{http_code}" "$BASE/api/tokens/$route")
            test "$code" = "401"
            python3 - "$route" <<'PY'
          import json,sys
          x=json.load(open("/tmp/private-"+sys.argv[1]+".json"))
          assert x["error"]=="SIGN_IN_REQUIRED"
          print("PRIVATE_ENDPOINT_AUTH_VERIFIED "+sys.argv[1])
          PY
          done

      - name: Verify live organic sharing and truthful sitemap
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$BASE/robots.txt" -o /tmp/robots.txt
          grep -q 'Disallow: /api/' /tmp/robots.txt
          grep -q 'Sitemap: https://signalforge-web-production.up.railway.app/sitemap.xml' /tmp/robots.txt
          curl -fsS --max-time 20 "$BASE/sitemap.xml" -o /tmp/sitemap.xml
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          x=ET.parse("/tmp/sitemap.xml").getroot()
          urls=[n.text for n in x.iter() if n.tag.endswith("loc")]
          assert any(u.endswith("/radar") for u in urls),urls
          assert all("/api/" not in u and "/app/" not in u for u in urls),urls
          print("LIVE_SITEMAP_VERIFIED indexable_urls="+str(len(urls)))
          PY
          curl -fsS --max-time 20 "$BASE/tokens/solana/$MINT" -o /tmp/radar-shared.html
          grep -q 'id="shareTelegram"' /tmp/radar-shared.html
          grep -q 'id="shareX"' /tmp/radar-shared.html
          grep -q '<link rel="canonical" href="https://signalforge-web-production.up.railway.app/tokens/solana/' /tmp/radar-shared.html
          echo "LIVE_SOCIAL_SHARING_VERIFIED"


      - name: Verify deployed private journal and admin revenue boundaries
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$BASE/radar" -o /tmp/radar-v2.html
          grep -q 'id="researchNotes"' /tmp/radar-v2.html
          grep -q 'id="noteForm"' /tmp/radar-v2.html
          for route in /admin/revenue /api/admin/revenue; do
            code=$(curl -sS --max-time 20 -o /tmp/revenue-private.json -w "%{http_code}" "$BASE$route")
            test "$code" = "403"
            python3 - <<'PY'
          import json
          o=json.load(open("/tmp/revenue-private.json"))
          assert o.get("error")=="Admin access required",o
          PY
          done
          code=$(curl -sS --max-time 20 -o /tmp/notes-private.json -w "%{http_code}" "$BASE/api/tokens/notes?address=$MINT")
          test "$code" = "401"
          python3 - <<'PY'
          import json
          o=json.load(open("/tmp/notes-private.json"))
          assert o.get("error")=="SIGN_IN_REQUIRED",o
          PY
          code=$(curl -sS --max-time 20 -o /tmp/notes-private-write.json -w "%{http_code}" -X POST -H 'content-type: application/json' --data '{"address":"So11111111111111111111111111111111111111112","kind":"note","body":"Unauthorized write must fail"}' "$BASE/api/tokens/notes")
          test "$code" = "401"
          echo "LIVE_RESEARCH_NOTES_UI_VERIFIED; PRIVATE_NOTES_GET_POST_DENIED; PRIVATE_REVENUE_GET_DENIED"

      - name: Verify commercial research and billing boundaries against deployed production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$BASE/radar" -o /tmp/commercial-radar.html
          grep -q 'id="researchMembership"' /tmp/commercial-radar.html
          grep -q 'renderSourceComparison' /tmp/commercial-radar.html
          grep -q '/app?view=pricing' /tmp/commercial-radar.html
          curl -fsS --max-time 20 "$BASE/app?billing=success&session_id=cs_untrusted_smoke" -o /tmp/commercial-app.html
          grep -q 'billingReturnStatus' /tmp/commercial-app.html
          grep -q 'A redirect is not payment confirmation' /tmp/commercial-app.html
          for endpoint in /api/billing/portal /api/engagement; do
            if test "$endpoint" = "/api/engagement"; then
              code=$(curl -sS --max-time 20 -o /tmp/commercial-private.json -w "%{http_code}" -X POST -H 'content-type: application/json' --data '{"action":"pricing_view"}' "$BASE$endpoint")
            else
              code=$(curl -sS --max-time 20 -o /tmp/commercial-private.json -w "%{http_code}" "$BASE$endpoint")
            fi
            test "$code" = "401"
            python3 - <<'PY'
          import json
          obj=json.load(open("/tmp/commercial-private.json"))
          assert obj.get("error")=="SIGN_IN_REQUIRED",obj
          PY
          done
          echo "LIVE_PREMIUM_RESEARCH_UI_OK; UNTRUSTED_CHECKOUT_REDIRECT_NOT_PAYMENT; PRIVATE_BILLING_AND_ENGAGEMENT_DENIED"
